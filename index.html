<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#52796f;font-family:Georgia,serif}
#splash{position:fixed;inset:0;background:#52796f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s}
#splash h1{font-family:Georgia,serif;font-size:28px;color:#fff;font-weight:700;text-align:center;line-height:1.3}
#splash p{color:#f5f0e8;font-size:13px;margin-top:8px;font-style:italic}
.dot-loader{display:flex;gap:6px;margin-top:32px}
.dot{width:8px;height:8px;border-radius:50%;background:#f5f0e8;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
#install-banner{position:fixed;bottom:0;left:0;right:0;background:#52796f;border-top:1px solid #f5f0e8;padding:14px 20px;display:none;justify-content:space-between;align-items:center;z-index:500;gap:12px}
#install-banner p{color:#fff;font-size:13px}.btn-install{background:#f5f0e8;color:#52796f;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn-dismiss{background:transparent;color:rgba(255,255,255,0.4);border:none;cursor:pointer;font-size:18px}
</style>
</head>

    <button class="btn-dismiss" id="btn-dismiss">✕</button>
  </div>
</div>
<div id="root"></div>

<script>
// Mount the app
const AppComponent = NyliramApp.default || NyliramApp;
if(AppComponent) {
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppComponent));
} else {
  document.getElementById('root').innerHTML = '<p style="color:red;padding:20px">Erreur chargement app</p>';
  console.error('App not found in:', Object.keys(NyliramApp || {}));
}

// Hide splash
window.addEventListener('load', () => {
  setTimeout(() => {
    const s = document.getElementById('splash');
    if(s) { s.style.opacity='0'; setTimeout(()=>s.remove(),500); }
  }, 1000);
});

// PWA install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if(!localStorage.getItem('nyliram-dismissed')) document.getElementById('install-banner').style.display='flex';
});
document.getElementById('btn-install')?.addEventListener('click', () => {
  if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt=null; }
  document.getElementById('install-banner').style.display='none';
});
document.getElementById('btn-dismiss')?.addEventListener('click', () => {
  document.getElementById('install-banner').style.display='none';
  localStorage.setItem('nyliram-dismissed','1');
});
</script>
